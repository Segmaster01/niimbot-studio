name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python tools/write_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match niimbot_studio.__version__ ($v)"
          }

      - name: Smoke test (import + offscreen render)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm NiimbotStudio.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer\NiimbotStudio.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: NiimbotStudio-Setup-${{ steps.version.outputs.version }}
          path: dist/NiimbotStudio-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item dist\NiimbotStudio-Setup-*.exe).FullName `
            --title "Niimbot Studio ${{ steps.version.outputs.version }}" --generate-notes
